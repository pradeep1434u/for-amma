<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5E7D0">
<meta name="description" content="A little Dhamma thought, every day.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png" type="image/png">
<title>Dhamma Daily</title>
<style>
:root{--bg:#fbf4e8;--card:#fffaf2;--ink:#3d342a;--muted:#786e62;--accent:#a56b35;--line:#eadcc8;--soft:#f1e2cc}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding-bottom:84px}.app{max-width:720px;margin:auto;padding:20px 18px}header{padding:12px 4px 18px}
.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}h1{font-family:Georgia,serif;font-size:36px;line-height:1.05;margin:7px 0 5px;font-weight:500}.sub{color:var(--muted);font-size:14px}
.hidden{display:none!important}.section{margin-top:28px}.section h2{font-family:Georgia,serif;font-size:23px;font-weight:500;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.chip{padding:15px;border:1px solid var(--line);background:var(--card);border-radius:17px;text-align:left;cursor:pointer;color:var(--ink)}.chip b{display:block;font-size:15px}.chip span{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.list{display:flex;flex-direction:column;gap:10px}.item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;cursor:pointer}.item-date{font-size:12px;color:var(--accent);font-weight:700}.item-text{margin-top:6px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}.item-section{font-size:11px;color:var(--muted);margin-top:8px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:28px 24px;box-shadow:0 10px 30px #6b51351a;min-height:520px;display:flex;flex-direction:column;touch-action:pan-y}.viewer{display:flex;flex-direction:column;flex:1}.date{font-size:13px;color:var(--accent);font-weight:700;margin-bottom:22px}.quote{font-family:Georgia,serif;font-size:25px;line-height:1.55;white-space:pre-wrap;overflow:visible;max-height:none;overflow-wrap:anywhere}.author{margin-top:20px;color:var(--muted);font-size:14px}.small{font-size:12px;color:var(--muted)}.context-back{margin-bottom:18px}
.actions{display:flex;gap:10px;margin-top:auto;min-height:48px;align-items:center;justify-content:center;padding-top:24px}.fav-btn{margin-left:auto;border:1px solid var(--line);background:var(--soft);color:var(--accent);width:42px;height:42px;border-radius:50%;font-size:21px;cursor:pointer}.fav-btn.active{background:#f0d7aa;border-color:#d3ad70}.quote-top{display:flex;align-items:flex-start;gap:12px}.quote-top .date{flex:1}.btn{border:1px solid var(--line);background:var(--soft);color:var(--ink);padding:11px 15px;border-radius:14px;font-weight:650;cursor:pointer}.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}.btn:disabled{opacity:.45;cursor:default}
.status{padding:18px;border-radius:18px;background:var(--soft);color:var(--muted);line-height:1.5}
nav{position:fixed;z-index:10;bottom:0;left:0;right:0;background:#fffaf2ee;backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:10px max(14px,calc((100vw - 720px)/2 + 14px));display:flex;justify-content:space-around}nav button{border:0;background:none;color:var(--muted);font-size:12px;padding:6px 12px;cursor:pointer}nav button.active{color:var(--accent);font-weight:800}
@media(min-width:600px){.quote{font-size:29px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app">
<header><div class="eyebrow">A little Dhamma thought, every day</div><h1>Dhamma Daily</h1><div class="sub" id="subtitle">Loading your collection…</div></header>

<main id="home">
  <div id="todayCard" class="hero"></div>
  <div class="section"><h2>Browse</h2><div class="grid"><button class="chip" onclick="showPage('days')"><b>All days</b><span>Read the collection</span></button><button class="chip" onclick="showPage('sections')"><b>Sections</b><span>Explore by theme</span></button><button class="chip" onclick="showPage('favorites')"><b>Favorites</b><span>Your bookmarked thoughts</span></button></div></div>
</main>

<main id="days" class="hidden">
  <div id="daysBrowse" class="section" style="margin-top:4px"><h2>All days</h2><div id="daysList" class="list"></div></div>
</main>

<main id="favorites" class="hidden">
  <div class="section" style="margin-top:4px"><h2>Favorites</h2><div id="favoritesList" class="list"></div></div>
</main>

<main id="sections" class="hidden">
  <div id="sectionBrowse" class="section" style="margin-top:4px"><h2>Sections</h2><div id="sectionList" class="grid"></div></div>
  <div id="sectionViewerWrap" class="hidden">
    <button class="btn context-back" onclick="backToSections()">← All sections</button>
    <div id="sectionViewer" class="hero"></div>
  </div>
</main>
</div>
<nav><button id="nav-home" class="active" onclick="showPage('home')">⌂<br>Today</button><button id="nav-days" onclick="showPage('days')">☷<br>Days</button><button id="nav-sections" onclick="showPage('sections')">◈<br>Sections</button><button id="nav-favorites" onclick="showPage('favorites')">♡<br>Favorites</button></nav>

<script>
const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vRaaomIQn_nLvIPERtpget8Y20iSDY_3pSlEGfwhzkvMfUHXIQ2P3XvQ0R0IB6SX4hBEonVRcvxXsIl/pub?output=csv";
let quotes=[],homeIndices=[],homePos=0,sectionIndices=[],sectionPos=0,activeSection="",touchStartX=0,touchStartY=0;
let favorites=new Set(JSON.parse(localStorage.getItem('dhammaDailyFavorites')||'[]'));
function favKey(q){return dateKey(q.date)+'|'+q.quote;}
function isFavorite(q){return favorites.has(favKey(q));}
function toggleFavorite(index, mode='home'){const q=quotes[index];if(!q)return;const k=favKey(q);if(favorites.has(k))favorites.delete(k);else favorites.add(k);localStorage.setItem('dhammaDailyFavorites',JSON.stringify([...favorites]));if(mode==='section')renderSectionQuote();else renderHomeQuote();renderFavorites();}
function parseCSV(text){const rows=[];let row=[],cell="",quoted=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&quoted&&n==='"'){cell+='"';i++;continue}if(c==='"'){quoted=!quoted;continue}if(c===','&&!quoted){row.push(cell);cell='';continue}if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&n==='\n')i++;row.push(cell);cell='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[];continue}cell+=c}if(cell!==''||row.length){row.push(cell);if(row.some(x=>x.trim()!==''))rows.push(row)}if(!rows.length)return[];const headers=rows.shift().map(h=>h.trim().toLowerCase());return rows.map(r=>{const o={};headers.forEach((h,i)=>o[h]=(r[i]||'').trim());return o}).filter(x=>x.date&&x.quote)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function dateParts(s){const raw=String(s||'').trim();let m;if((m=raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)))return{year:+m[1],month:+m[2],day:+m[3],key:String(+m[2]).padStart(2,'0')+'-'+String(+m[3]).padStart(2,'0')};if((m=raw.match(/^(\d{1,2})[\/-](\d{1,2})(?:[\/-](\d{4}))?$/)))return{year:m[3]?+m[3]:null,month:+m[2],day:+m[1],key:String(+m[2]).padStart(2,'0')+'-'+String(+m[1]).padStart(2,'0')};const d=new Date(raw);if(!isNaN(d))return{year:d.getFullYear(),month:d.getMonth()+1,day:d.getDate(),key:String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};return{year:null,month:null,day:null,key:raw}}
function dateKey(s){return dateParts(s).key}function niceDate(s){const p=dateParts(s);if(!p.month||!p.day)return s;return new Date(2000,p.month-1,p.day).toLocaleDateString(undefined,{day:'numeric',month:'long'})}function todayKey(){const d=new Date();return String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function showPage(page){['home','days','sections','favorites'].forEach(p=>document.getElementById(p).classList.toggle('hidden',p!==page));['home','days','sections','favorites'].forEach(p=>document.getElementById('nav-'+p).classList.toggle('active',p===page));if(page!=='sections'){document.getElementById('sectionBrowse').classList.remove('hidden');document.getElementById('sectionViewerWrap').classList.add('hidden')}window.scrollTo({top:0,behavior:'smooth'})}
function renderHomeQuote(label=''){if(!homeIndices.length)return;const q=quotes[homeIndices[homePos]],pos=homePos,total=homeIndices.length;document.getElementById('todayCard').innerHTML=`<div class="viewer"><div class="quote-top"><div class="date">${label?esc(label)+' · ':''}${esc(niceDate(q.date))}</div><button class="fav-btn ${isFavorite(q)?'active':''}" aria-label="${isFavorite(q)?'Remove from favorites':'Add to favorites'}" onclick="toggleFavorite(${homeIndices[homePos]})">${isFavorite(q)?'★':'☆'}</button></div><div class="quote">${esc(q.quote)}</div>${q.author?`<div class="author">— ${esc(q.author)}</div>`:''}<div class="small" style="margin-top:15px">${esc(q.section||'')}</div><div class="actions"><button class="btn" ${pos<=0?'disabled':''} onclick="moveHome(-1)">← Previous</button><span class="small">${pos+1} / ${total}</span><button class="btn primary" ${pos>=total-1?'disabled':''} onclick="moveHome(1)">Next →</button></div></div>`}
function moveHome(delta){const n=homePos+delta;if(n<0||n>=homeIndices.length)return;homePos=n;renderHomeQuote();window.scrollTo({top:0,behavior:'smooth'})}
function openDay(i){homeIndices=quotes.map((_,x)=>x);homePos=Math.max(0,i);showPage('home');renderHomeQuote();}
function renderSectionQuote(){if(!sectionIndices.length)return;const q=quotes[sectionIndices[sectionPos]],pos=sectionPos,total=sectionIndices.length;document.getElementById('sectionViewer').innerHTML=`<div class="viewer"><div class="quote-top"><div class="date">${esc(niceDate(q.date))}</div><button class="fav-btn ${isFavorite(q)?'active':''}" aria-label="${isFavorite(q)?'Remove from favorites':'Add to favorites'}" onclick="toggleFavorite(${sectionIndices[sectionPos]},'section')">${isFavorite(q)?'★':'☆'}</button></div><div class="quote">${esc(q.quote)}</div>${q.author?`<div class="author">— ${esc(q.author)}</div>`:''}<div class="small" style="margin-top:15px">${esc(q.section||activeSection)}</div><div class="actions"><button class="btn" ${pos<=0?'disabled':''} onclick="moveSection(-1)">← Previous</button><span class="small">${pos+1} / ${total}</span><button class="btn primary" ${pos>=total-1?'disabled':''} onclick="moveSection(1)">Next →</button></div></div>`}
function moveSection(delta){const n=sectionPos+delta;if(n<0||n>=sectionIndices.length)return;sectionPos=n;renderSectionQuote();window.scrollTo({top:0,behavior:'smooth'})}
function showSection(s){activeSection=s;sectionIndices=quotes.map((q,i)=>({q,i})).filter(o=>(o.q.section||'Other')===s).map(o=>o.i);sectionPos=0;document.getElementById('sectionBrowse').classList.add('hidden');document.getElementById('sectionViewerWrap').classList.remove('hidden');document.getElementById('sectionViewerWrap').scrollIntoView({block:'start'});renderSectionQuote();}
function backToSections(){document.getElementById('sectionViewerWrap').classList.add('hidden');document.getElementById('sectionBrowse').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}
function openFavorite(i){homeIndices=quotes.map((q,x)=>isFavorite(q)?x:null).filter(x=>x!==null);homePos=homeIndices.indexOf(i);if(homePos<0)homePos=0;showPage('home');renderHomeQuote('Favorites');}
function renderFavorites(){const list=document.getElementById('favoritesList');const ids=quotes.map((q,i)=>isFavorite(q)?i:null).filter(i=>i!==null);if(!ids.length){list.innerHTML='<div class="status">No favorites yet.<br><br>Tap ☆ on any thought to bookmark it here.</div>';return;}list.innerHTML=ids.map(i=>{const q=quotes[i];return `<div class="item" onclick="openFavorite(${i})"><div class="item-date">${esc(niceDate(q.date))}</div><div class="item-text">${esc(q.quote)}</div><div class="item-section">${esc(q.section||'')}</div></div>`}).join('');}
function renderLists(){document.getElementById('daysList').innerHTML=quotes.map((q,i)=>`<div class="item" onclick="openDay(${i})"><div class="item-date">${esc(niceDate(q.date))}</div><div class="item-text">${esc(q.quote)}</div><div class="item-section">${esc(q.section||'')}</div></div>`).join('');const counts={};quotes.forEach(q=>{const s=q.section||'Other';counts[s]=(counts[s]||0)+1});const list=document.getElementById('sectionList');list.innerHTML='';Object.entries(counts).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([s,n])=>{const b=document.createElement('button');b.className='chip';b.type='button';b.innerHTML=`<b>${esc(s)}</b><span>${n} ${n===1?'thought':'thoughts'}</span>`;b.addEventListener('click',()=>showSection(s));list.appendChild(b)})}
function setupSwipe(){const targets=[document.getElementById('todayCard'),document.getElementById('sectionViewer')];targets.forEach(card=>{card.addEventListener('touchstart',e=>{if(e.touches.length===1){touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY}},{passive:true});card.addEventListener('touchend',e=>{if(touchStartX===0)return;const dx=e.changedTouches[0].clientX-touchStartX,dy=e.changedTouches[0].clientY-touchStartY;touchStartX=touchStartY=0;if(Math.abs(dx)<60||Math.abs(dx)<=Math.abs(dy))return;if(card.id==='sectionViewer')moveSection(dx<0?1:-1);else moveHome(dx<0?1:-1)},{passive:true})})}
async function load(){try{const res=await fetch(CSV_URL+'&_='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error();quotes=parseCSV(await res.text());quotes.sort((a,b)=>dateKey(a.date).localeCompare(dateKey(b.date)));if(!quotes.length)throw Error();document.getElementById('subtitle').textContent=`${quotes.length} thoughts · updated from your collection`;renderLists();renderFavorites();setupSwipe();homeIndices=quotes.map((_,i)=>i);const idx=quotes.findIndex(q=>dateKey(q.date)===todayKey());homePos=idx>=0?idx:quotes.length-1;renderHomeQuote(idx>=0?"Today's thought":"Latest available");localStorage.setItem('dhammaDailyQuotes',JSON.stringify(quotes))}catch(e){const c=localStorage.getItem('dhammaDailyQuotes')||localStorage.getItem('forAmmaQuotes');if(c){quotes=JSON.parse(c);renderLists();renderFavorites();setupSwipe();homeIndices=quotes.map((_,i)=>i);const idx=quotes.findIndex(q=>dateKey(q.date)===todayKey());homePos=idx>=0?idx:quotes.length-1;renderHomeQuote(idx>=0?"Today's thought":"Latest available")}else document.getElementById('todayCard').innerHTML='<div class="status"><b>Couldn\'t load the collection.</b><br><br>Please check the internet connection and open the app again.</div>'}}
load();
</script>
</body></html>
